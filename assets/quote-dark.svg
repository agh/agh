<svg xmlns="http://www.w3.org/2000/svg" width="360" height="100" viewBox="0 0 360 100" role="img" aria-labelledby="title">
  <title id="title">The best infrastructure disappears. If people are thinking about it, you've already failed.</title>
  <g fill="#A78BFA" font-family="monospace" font-size="18">
    <text x="0" y="20">The best infrastructure</text>
    <text x="0" y="44">disappears.</text>
    <text x="0" y="68">If people are thinking about it,</text>
    <text x="0" y="92">you've already failed.</text>
  </g>
</svg>
